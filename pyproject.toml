[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "chainshot"
version = "0.1.0"
description = "Straight-line billiards logic puzzle solver and level generator"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "madowaku" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
chainshot = "chainshot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chainshot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
